services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pullhaus
      POSTGRES_PASSWORD: pullhaus
      POSTGRES_DB: pullhaus
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pullhaus"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337"]
    ports:
      - "8545:8545"
